<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Sunset Keys — Coral Bay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d18; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #mission-box {
    position: absolute; top: 16px; left: 16px; max-width: 420px;
    background: rgba(10, 10, 20, 0.62); border-left: 4px solid #00ffa3;
    padding: 10px 14px; border-radius: 6px; backdrop-filter: blur(2px);
  }
  #mission-name { font-weight: 800; font-size: 17px; letter-spacing: 0.4px; }
  #mission-obj { font-size: 13px; color: #d7e0ea; margin-top: 3px; }
  #mission-timer { font-size: 15px; font-weight: 700; color: #ffe600; margin-top: 3px; }
  #top-right { position: absolute; top: 16px; right: 16px; text-align: right; }
  #minimap { border: 2px solid rgba(255,255,255,0.55); border-radius: 8px; background: #101018; }
  #cash-line { margin-top: 6px; font-size: 20px; font-weight: 800; }
  #cash-line #clock { font-size: 13px; font-weight: 600; color: #c9d4de; margin-left: 10px; }
  #stars { font-size: 22px; letter-spacing: 3px; margin-top: 2px; text-shadow: 0 0 8px rgba(255,46,99,0.7); }
  #speed-box { position: absolute; right: 18px; bottom: 18px; text-align: right; }
  #speed { font-size: 52px; font-weight: 900; line-height: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  #speed-unit { font-size: 13px; color: #d7e0ea; }
  #vitals { position: absolute; left: 18px; bottom: 18px; width: 220px; }
  .bar { position: relative; height: 16px; background: rgba(10,10,20,0.6); border-radius: 8px; margin-bottom: 6px; overflow: hidden; }
  .bar div { height: 100%; border-radius: 8px; transition: width 0.2s; }
  #health-fill { background: linear-gradient(90deg, #ff5e7a, #ff2e63); width: 100%; }
  #armor-fill { background: linear-gradient(90deg, #00e5ff, #2ec4b6); width: 0%; }
  .bar span { position: absolute; left: 8px; top: 1px; font-size: 10px; font-weight: 700; letter-spacing: 1px; }
  #radio-line { font-size: 13px; color: #ffe600; text-shadow: 0 1px 4px rgba(0,0,0,0.7); }
  #radio-hint { color: #c9d4de; font-size: 11px; }
  #message {
    position: absolute; top: 84px; left: 50%; transform: translateX(-50%);
    font-size: 17px; font-weight: 700; text-align: center; max-width: 640px;
    background: rgba(10,10,20,0.62); padding: 8px 16px; border-radius: 6px;
    transition: opacity 0.3s;
  }
  #prompt {
    position: absolute; bottom: 92px; left: 50%; transform: translateX(-50%);
    font-size: 15px; font-weight: 700; background: rgba(10,10,20,0.7);
    padding: 7px 14px; border-radius: 6px; border: 1px solid rgba(255,230,0,0.5);
  }
  #prompt:empty { display: none; }
  #banner {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    font-size: 64px; font-weight: 900; letter-spacing: 6px; color: #ff2e63;
    text-shadow: 0 0 24px rgba(255,46,99,0.8), 0 2px 0 rgba(0,0,0,0.6);
    transition: opacity 0.3s;
  }
  #title-screen, #pause-screen {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(20,8,32,0.55), rgba(8,8,28,0.78));
  }
  .title-inner { max-width: 640px; text-align: center; padding: 24px; }
  .title-kicker { font-size: 13px; letter-spacing: 5px; color: #00ffa3; font-weight: 700; }
  .title-inner h1 {
    font-size: 84px; font-weight: 900; line-height: 0.95; margin: 10px 0;
    background: linear-gradient(180deg, #ffe600, #ff5e7a 55%, #7c4dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none;
  }
  .title-story { font-size: 15px; line-height: 1.55; color: #e6edf3; }
  .title-controls { margin-top: 14px; font-size: 12.5px; color: #b9c4cf; line-height: 1.6; }
  .title-missions { margin-top: 16px; text-align: left; }
  .mrow { display: flex; gap: 10px; font-size: 13px; padding: 5px 8px; background: rgba(255,255,255,0.06); border-radius: 5px; margin-bottom: 4px; }
  .mrow.done { opacity: 0.6; }
  .mrow .mname { font-weight: 700; min-width: 130px; color: #ffe600; }
  .mrow .mdesc { flex: 1; color: #d7e0ea; }
  .mrow .mpay { font-weight: 700; color: #00ffa3; }
  .title-start { margin-top: 20px; font-size: 20px; font-weight: 800; letter-spacing: 3px; color: #fff; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  .pause-inner { text-align: center; max-width: 560px; }
  .pause-inner h2 { font-size: 44px; letter-spacing: 6px; }
  .pause-inner p { color: #b9c4cf; margin: 8px 0 16px; }
  #shop-panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 460px; background: rgba(12, 12, 24, 0.94); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 10px; padding: 20px; pointer-events: auto; display: none;
  }
  #shop-panel h2 { font-size: 22px; margin-bottom: 12px; color: #ffe600; }
  .shop-item { padding: 10px 12px; border-radius: 6px; background: rgba(255,255,255,0.07); margin-bottom: 8px; cursor: pointer; }
  .shop-item:hover { background: rgba(255,255,255,0.14); }
  .shop-item.disabled { opacity: 0.45; cursor: default; }
  .shop-label { font-size: 14px; font-weight: 600; }
  .shop-price { font-size: 15px; font-weight: 800; color: #00ffa3; margin-top: 2px; }
  .shop-note { font-size: 12px; color: #ff9a9a; margin-top: 2px; }
  .shop-close { font-size: 12px; color: #b9c4cf; text-align: center; margin-top: 6px; }
  #verify { position: absolute; left: -9999px; top: 0; font-size: 1px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
